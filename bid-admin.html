<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bid Admin — Daily Deals Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--surface:#f6f7fb;--line:#e7e9f0;--ink:#161a23;--muted:#727a8c;--g1:#0f9b6c;--g2:#17c39a;--hot:#e0483c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-feature-settings:"tnum" 1}
  .wrap{max-width:720px;margin:0 auto;padding:30px 18px 60px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
  .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .card{margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:20px}
  h2{font-size:16px;font-weight:700;margin:0 0 16px}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  .hint{font-weight:400;color:var(--muted)}
  input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:15px;
        font-family:inherit;background:var(--surface);margin-bottom:14px}
  input:focus{outline:2px solid var(--g1);outline-offset:1px;background:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  button{font-family:inherit;border:0;cursor:pointer}
  .cta{width:100%;border-radius:14px;padding:16px;font-size:16px;font-weight:700;color:#fff;
       background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 20px rgba(15,155,108,.22)}
  .note{margin-top:12px;font-size:14px;color:var(--muted)}
  .note.err{color:var(--hot)}
  .link{margin-top:14px;padding:14px;border-radius:12px;background:#f0fbf6;border:1px solid #dcefe6;
        font-size:14px;word-break:break-all}
  .link button{margin-top:10px;padding:9px 14px;border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
  .deal{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .deal:first-child{border-top:0}
  .deal .m{flex:1}
  .deal .t{font-weight:700;font-size:15px}
  .deal .d{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  .pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--surface);color:var(--muted)}
  .pill.live{background:#e8f8f1;color:#0b7a55}
  .pill.ordered{background:#eaf0ff;color:#2a48b8}
  .end{padding:7px 11px;border-radius:9px;background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
  input[type=file]{padding:10px;background:#fff}
  .thumbs{display:flex;gap:10px;margin-bottom:14px}
  .thumbs img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bid Admin</h1>
  <div class="sub">Deal banao, link group me daalo, bidding live dekho.</div>

  <section id="gate" class="card">
    <h2>Admin password</h2>
    <input id="pw" type="password" placeholder="Password">
    <button class="cta" id="go">Kholein</button>
    <div class="note err" id="gateNote"></div>
  </section>

  <section id="panel" class="hide">
    <div class="card">
      <h2>Form links <span class="hint">— ek baar set karo, har deal me lag jayenge</span></h2>
      <label for="sOrder">Order form ka link</label>
      <input id="sOrder" placeholder="https://docs.google.com/forms/d/e/.../viewform">
      <div class="grid">
        <div><label for="sEc">Prefill: deal code</label><input id="sEc" placeholder="entry.1234567"></div>
        <div><label for="sEn">Prefill: naam</label><input id="sEn" placeholder="entry.7654321"></div>
      </div>
      <div class="grid">
        <div><label for="sEa">Prefill: order amount</label><input id="sEa" placeholder="entry.1112223"></div>
        <div><label for="sEb">Prefill: bid <span class="hint">optional</span></label><input id="sEb" placeholder="entry.5556667"></div>
      </div>

      <label for="sRefund">Refund form ka link</label>
      <input id="sRefund" placeholder="https://docs.google.com/forms/d/e/.../viewform">
      <div class="grid">
        <div><label for="sRc">Prefill: deal code</label><input id="sRc" placeholder="entry.2223334"></div>
        <div><label for="sRn">Prefill: naam</label><input id="sRn" placeholder="entry.3334445"></div>
      </div>
      <div class="grid">
        <div><label for="sRa">Prefill: refund amount</label><input id="sRa" placeholder="entry.4445556"></div>
        <div><label for="sRb">Prefill: bid <span class="hint">optional</span></label><input id="sRb" placeholder="entry.6667778"></div>
      </div>

      <button class="cta" id="saveSet">Form links save karein</button>
      <div class="note" id="setNote"></div>
    </div>

    <div class="card">
      <h2>Nayi deal</h2>
      <div class="grid">
        <div><label for="code">Deal code</label><input id="code" placeholder="8001"></div>
        <div><label for="mrp">Product price ₹</label><input id="mrp" type="number" placeholder="200"></div>
      </div>
      <label for="title">Product ka naam</label>
      <input id="title" placeholder="Wireless Neckband">
      <div class="grid">
        <div><label for="start">Starting bid ₹</label><input id="start" type="number" value="10"></div>
        <div><label for="step">Har tap par +₹</label><input id="step" type="number" value="5"></div>
        <div><label for="cappct">Max bid <span class="hint">(% of price)</span></label><input id="cappct" type="number" value="50"></div>
        <div><label for="mins">Timer <span class="hint">(minutes)</span></label><input id="mins" type="number" value="5"></div>
      </div>

      <label for="prod">Product ka link <span class="hint">— sirf winner ko dikhega</span></label>
      <input id="prod" placeholder="https://... deal ya affiliate link">

      <div class="grid">
        <div><label for="img1">Photo 1 <span class="hint">optional</span></label><input id="img1" type="file" accept="image/*"></div>
        <div><label for="img2">Photo 2 <span class="hint">optional</span></label><input id="img2" type="file" accept="image/*"></div>
      </div>
      <div class="thumbs" id="thumbs"></div>

      <label for="form">Order form <span class="hint">— khali chhodo to upar wala default lagega</span></label>
      <input id="form" placeholder="Default use karein">

      <label for="refund">Refund form <span class="hint">— khali chhodo to default lagega</span></label>
      <input id="refund" placeholder="Default use karein">

      <button class="cta" id="create">Deal banao aur link do</button>
      <div class="note" id="note"></div>
      <div class="link hide" id="linkBox"></div>
    </div>

    <div class="card">
      <h2>Saari deals</h2>
      <div id="list" class="note">Load ho raha hai...</div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://vhnmtjmdiqdckrvyslsq.supabase.co";
const SUPABASE_KEY = "sb_publishable_zLlErI30rbLGpViVmgYE4g_FeBI8tKd";
// bid.html isi folder me hai — agar alag jagah ho to yahan full URL daal dein
const BID_PAGE = location.href.replace(/[^/]*$/, "") + "bid.html";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let pass = sessionStorage.getItem("ddl_bid_pass") || "";

const rupee = n => "₹" + Number(n||0).toLocaleString("en-IN");
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

if(pass) open_();

$("go").onclick = () => { pass = $("pw").value.trim(); open_(); };
$("pw").onkeydown = e => { if(e.key === "Enter") $("go").click(); };

async function open_(){
  const { data } = await sb.rpc("ddl_admin_list", { p_pass: pass });
  if(!data || !data.ok){ $("gateNote").textContent = "Galat password"; pass = ""; return; }
  sessionStorage.setItem("ddl_bid_pass", pass);
  $("gate").classList.add("hide"); $("panel").classList.remove("hide");
  paint(data.deals);
  loadSettings();
  setInterval(refresh, 5000);
}

const SET_MAP = { sOrder:"order_form_url", sEc:"entry_code", sEn:"entry_name", sEa:"entry_amount",
                  sRefund:"refund_form_url", sRc:"entry_rf_code", sRn:"entry_rf_name",
                  sRa:"entry_rf_amount", sEb:"entry_bid", sRb:"entry_rf_bid" };

async function loadSettings(){
  const { data } = await sb.rpc("ddl_admin_settings", { p_pass: pass });
  if(!data || !data.ok) return;
  for(const k in SET_MAP) $(k).value = data.settings[SET_MAP[k]] || "";
}

$("saveSet").onclick = async () => {
  const p = {};
  for(const k in SET_MAP) p[SET_MAP[k]] = $(k).value.trim() || null;
  $("setNote").className = "note"; $("setNote").textContent = "Save ho raha hai...";
  const { data, error } = await sb.rpc("ddl_admin_settings", { p_pass: pass, p });
  if(error || !data || !data.ok){
    $("setNote").className = "note err"; $("setNote").textContent = "Save nahi hua, dobara try karein";
  } else {
    $("setNote").textContent = "Save ho gaya. Ab har nayi deal me yahi links lagenge.";
  }
};

async function refresh(){
  const { data } = await sb.rpc("ddl_admin_list", { p_pass: pass });
  if(data && data.ok) paint(data.deals);
}

function preview(){
  const files = [$("img1").files[0], $("img2").files[0]].filter(Boolean);
  $("thumbs").innerHTML = files.map(f => "<img src='" + URL.createObjectURL(f) + "'>").join("");
}
$("img1").onchange = preview;
$("img2").onchange = preview;

async function uploadImg(file, code, n){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = code + "-" + n + "-" + Date.now() + "." + ext;
  const { error } = await sb.storage.from("deal-images").upload(path, file, { upsert: true });
  if(error) throw error;
  return sb.storage.from("deal-images").getPublicUrl(path).data.publicUrl;
}

$("create").onclick = async () => {
  const p = {
    code: $("code").value.trim(),
    title: $("title").value.trim(),
    mrp: Number($("mrp").value),
    start: Number($("start").value),
    step: Number($("step").value),
    cap_pct: Number($("cappct").value),
    minutes: Number($("mins").value),
    order_form_url: $("form").value.trim(),
    refund_form_url: $("refund").value.trim(),
    product_url: $("prod").value.trim()
  };
  if(!p.code || !p.mrp){
    $("note").className = "note err"; $("note").textContent = "Deal code aur product price zaroori hain";
    return;
  }
  $("note").className = "note";

  try {
    const f1 = $("img1").files[0], f2 = $("img2").files[0];
    if(f1 || f2){
      $("note").textContent = "Photo upload ho rahi hai...";
      if(f1) p.image1 = await uploadImg(f1, p.code, 1);
      if(f2) p.image2 = await uploadImg(f2, p.code, 2);
    }
  } catch(e){
    $("note").className = "note err";
    $("note").textContent = "Photo upload nahi hui: " + (e.message || e);
    return;
  }

  $("note").textContent = "Ban rahi hai...";
  const { data, error } = await sb.rpc("ddl_admin_create_deal", { p_pass: pass, p });
  if(error || !data.ok){
    $("note").className = "note err";
    $("note").textContent = (data && data.msg) || "Nahi bani, dobara try karein";
    return;
  }
  const url = BID_PAGE + "?d=" + encodeURIComponent(p.code);
  $("note").textContent = "Timer chalu ho gaya. Link abhi group me daal dein.";
  const box = $("linkBox");
  box.classList.remove("hide");
  box.innerHTML = esc(url) + "<br><button id='cp'>Link copy karein</button> <button id='wa'>WhatsApp par bhejein</button>";
  $("img1").value = ""; $("img2").value = ""; $("thumbs").innerHTML = "";
  $("cp").onclick = () => { navigator.clipboard.writeText(url); $("cp").textContent = "Copy ho gaya"; };
  $("wa").onclick = () => {
    const msg = "🔥 LIVE BID — " + (p.title || ("Deal " + p.code)) +
      "\nCode: " + p.code + " | Price: " + rupee(p.mrp) +
      "\nBid " + rupee(p.start) + " se shuru, har tap +" + rupee(p.step) +
      "\nTimer: " + p.minutes + " min\n\n" + url;
    window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
  };
  refresh();
};

function paint(deals){
  const box = $("list");
  if(!deals.length){ box.className = "note"; box.textContent = "Abhi koi deal nahi."; return; }
  box.className = "";
  box.innerHTML = deals.map(d => {
    const live = d.status === "live";
    const secs = Math.max(0, Math.round((new Date(d.ends_at) - Date.now())/1000));
    const line = live
      ? "Abhi " + (d.current_bid ? rupee(d.current_bid) + " · " + esc(d.current_bidder_name) : "koi bid nahi") +
        " · " + Math.floor(secs/60) + ":" + String(secs%60).padStart(2,"0") + " bache"
      : d.status === "expired" ? "Koi bid nahi aayi"
      : "Jeete " + esc(d.winner_name) + " · bid " + rupee(d.winning_bid) +
        (d.order_amount ? " · order " + rupee(d.order_amount) : "") +
        (d.order_id ? " · ID " + esc(d.order_id) : (d.status === "ordered" ? " · form khol chuke hain" : " · form abhi nahi khola"));
    return "<div class='deal'><div class='m'><div class='t'>" + esc(d.title || d.code) +
      " <span class='hint'>#" + esc(d.code) + "</span></div>" +
      "<div class='d'>" + line + " · " + d.bid_count + " bids · max " + rupee(d.mrp*d.cap_pct/100) + "</div></div>" +
      "<span class='pill " + d.status + "'>" + d.status + "</span>" +
      (live ? "<button class='end' data-code='" + esc(d.code) + "'>End</button>" : "") + "</div>";
  }).join("");
  box.querySelectorAll(".end").forEach(b => b.onclick = async () => {
    await sb.rpc("ddl_admin_end_now", { p_pass: pass, p_code: b.dataset.code });
    refresh();
  });
}
</script>
</body>
</html>
